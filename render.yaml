services:
  - type: web
    name: kiro-watchparty
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WS_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
